services:
  zelqora:
    build: ..
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env.production
    volumes:
      - zelqora-data:/app/data
      - zelqora-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  zelqora-data:
  zelqora-uploads:
