name: Import Zelqora ZIP

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Zelqora ZIP
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          unzip -o "$ZIP" -d .
          rm -f "$ZIP"

      - name: Flatten extracted project folder
        run: |
          DIR="$(find . -maxdepth 1 -type d -name 'zelqora-v11-nonpayment-launch*' | head -n 1)"
          if [ -n "$DIR" ]; then
            shopt -s dotglob
            cp -R "$DIR"/* .
            rm -rf "$DIR"
          fi

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import Zelqora project"
          git push
