name: Build Zelqora Android app

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install server dependencies
        run: npm install --ignore-scripts

      - name: Check server.js syntax
        continue-on-error: true
        run: node --check server.js
      - name: Check feature-api.js syntax
        continue-on-error: true
        run: node --check feature-api.js
      - name: Check ultimate-api.js syntax
        continue-on-error: true
        run: node --check ultimate-api.js
      - name: Check signature-api.js syntax
        continue-on-error: true
        run: node --check signature-api.js

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync web app into Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Configure AdMob test app ID
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path("android/app/src/main/AndroidManifest.xml")
          app_id="${{ vars.ZELQORA_ADMOB_ANDROID_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}"
          s=manifest.read_text()
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s=s.replace('<application', '<application\\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'+app_id+'"/>', 1)
              manifest.write_text(s)
          PY
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zelqora-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
