name: Build Zelqora Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  android-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android
      - name: Sync web app
        working-directory: mobile
        run: npx cap sync android
      - name: Build Android App Bundle
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: zelqora-android-release-unsigned
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
