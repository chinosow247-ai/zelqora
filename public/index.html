<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080912"><title>Zelqora — Chat • Watch • Connect</title><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="/assets/zelqora-logo.png"><style>
:root{--bg:#070811;--panel:#101321;--line:#252a3e;--muted:#a8aec3;--accent:#5b7cff;--pink:#ff3b9d}*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#1c2b72,#070811 55%)}.authCard{width:min(420px,100%);background:#101321ee;border:1px solid #2c3350;border-radius:28px;padding:24px;box-shadow:0 20px 80px #000}.logo{width:70px;height:70px;border-radius:20px}.field{width:100%;padding:13px 14px;margin:6px 0;background:#080a13;border:1px solid var(--line);border-radius:13px;color:#fff;outline:none}.btn{border:0;border-radius:13px;padding:11px 15px;background:linear-gradient(90deg,#22c5ff,#675bff,#f72d9d);color:#fff;font-weight:800}.btn.alt{background:#171b2c;border:1px solid #30364d}.app{height:100dvh;max-width:620px;margin:auto;background:#080911;position:relative;overflow:hidden}.top{height:58px;position:absolute;z-index:10;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(#000b,transparent);pointer-events:none}.top>*{pointer-events:auto}.miniLogo{width:35px;height:35px;border-radius:11px}.page{display:none;height:100%;overflow:auto;padding-bottom:74px}.page.active{display:block}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}.reel{height:100%;min-height:100%;scroll-snap-align:start;position:relative;background:#080911;display:flex;align-items:center;justify-content:center}.reel video,.reel .media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05060b}.shade{position:absolute;inset:0;background:linear-gradient(transparent 35%,transparent 48%,#000b 100%);pointer-events:none}.reelInfo{position:absolute;left:14px;right:82px;bottom:76px;text-shadow:0 1px 3px #000}.reelInfo h3{margin:0 0 7px}.reelInfo p{margin:5px 0;color:#eee}.tag{color:#9bdcff;font-weight:700}.rail{position:absolute;right:10px;bottom:76px;display:flex;flex-direction:column;align-items:center;gap:15px}.rail button{background:transparent;border:0;color:#fff;font-size:25px;text-shadow:0 2px 4px #000}.rail span{display:block;font-size:11px;margin-top:-12px}.bottom{height:76px;position:absolute;z-index:20;bottom:0;left:8px;right:8px;background:linear-gradient(180deg,#101524f7,#080b14f9);border:1px solid #252e49;border-radius:24px 24px 16px 16px;display:grid;grid-template-columns:1fr 1fr 1.35fr 1fr 1fr;padding:0 8px env(safe-area-inset-bottom);gap:4px;box-shadow:0 -8px 30px #0008,inset 0 1px 0 #ffffff12;backdrop-filter:blur(18px)}.bottom button{position:relative;border:0;background:transparent;color:#818aa4;font-size:10px;min-width:0;font-weight:800;letter-spacing:.25px;border-radius:16px;transition:color .2s,transform .2s,background .2s}.bottom button b{display:block;font-size:21px;line-height:23px;font-weight:900;margin-bottom:2px}.bottom button.active{color:#fff;background:linear-gradient(180deg,#ffffff10,#6d7cff12)}.bottom button.active::after{content:"";position:absolute;bottom:5px;left:50%;width:16px;height:3px;border-radius:99px;background:linear-gradient(90deg,#4eeaff,#9a62ff,#ff63c5);transform:translateX(-50%);box-shadow:0 0 12px #8b6cff}.bottom button:not(.zel-create):active{transform:scale(.94)}.create{font-size:10px!important;background:transparent!important}.zel-create{position:relative!important;display:flex!important;flex-direction:column;align-items:center;justify-content:flex-start;gap:0!important;color:#fff!important;overflow:visible!important;touch-action:manipulation}.zel-create b{width:60px;height:54px;margin-top:-18px;border-radius:18px;display:grid!important;place-items:center!important;background:linear-gradient(145deg,#071526 0%,#12345a 32%,#365dff 56%,#9a45ff 78%,#ff4aa8 100%);border:1px solid #9feaffaa;box-shadow:0 0 0 5px #070811,0 14px 34px #365dff55,0 0 42px #a945ff33,inset 0 1px 0 #ffffff44;clip-path:polygon(50% 0%,91% 13%,100% 50%,91% 87%,50% 100%,9% 87%,0 50%,9% 13%);transform:none;transition:transform .2s ease,filter .2s ease}.zel-create:active b{transform:scale(.94) rotate(-2deg);filter:brightness(1.12)}.zel-create-core{display:grid;place-items:center;width:35px;height:35px;border-radius:12px 15px 12px 15px;background:linear-gradient(145deg,#06101d,#111d36);color:#fff;font-size:23px;font-weight:950;line-height:1;letter-spacing:-1px;text-shadow:0 0 14px #8deaff;position:relative;box-shadow:inset 0 0 0 1px #ffffff18}.zel-create-core::before{content:"";position:absolute;width:7px;height:7px;border:2px solid #8deaff;border-radius:50%;right:-9px;top:-8px;box-shadow:0 0 12px #8deaff}.zel-create-core::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;left:-9px;bottom:-7px;background:#ff65c2;box-shadow:0 0 10px #ff65c2}.zel-create-label{font-size:10px;font-weight:900;letter-spacing:.6px;margin-top:5px;color:#edf1ff}.zel-create::before{content:"";position:absolute;top:0;left:50%;width:20px;height:4px;border-radius:99px;background:linear-gradient(90deg,transparent,#9feaff,transparent);box-shadow:0 0 16px #6ddcff;transform:translateX(-50%);opacity:.95}.panel{padding:70px 14px 20px}.card{background:#101321;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.pill{font-size:11px;background:#202844;border-radius:99px;padding:5px 8px;color:#b6eaff}.stories{display:flex;gap:12px;overflow:auto;padding:10px 0}.story{min-width:68px;text-align:center;font-size:11px}.storyAvatar{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#19caff,#ff2d9d);margin:auto}.storyAvatar>div{width:100%;height:100%;border-radius:50%;background:#20253a;display:grid;place-items:center;overflow:hidden}.storyAvatar img{width:100%;height:100%;object-fit:cover}.user{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #222638}.avatar{width:43px;height:43px;border-radius:50%;background:#202640;display:grid;place-items:center;overflow:hidden;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}.chatMsgs{min-height:52vh;max-height:58vh;overflow:auto;padding:5px}.msg{max-width:78%;padding:9px 12px;background:#191f32;border-radius:16px;margin:6px 0}.mine{margin-left:auto;background:#30458c}.discoverGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.thumb{aspect-ratio:3/4;background:#151a2a;overflow:hidden}.thumb video{width:100%;height:100%;object-fit:cover}.profileHead{text-align:center;padding-top:15px}.bigAvatar{width:92px;height:92px;border-radius:50%;background:#252b43;margin:auto;overflow:hidden}.bigAvatar img{width:100%;height:100%;object-fit:cover}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:14px 0}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:end center}.sheet{width:min(620px,100%);background:#111522;border-radius:22px 22px 0 0;padding:18px;max-height:82vh;overflow:auto}.toast{position:fixed;z-index:100;bottom:82px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 15px;border-radius:99px;font-weight:700}.loader{text-align:center;padding:40px}.search{position:sticky;top:0;z-index:5;background:#080911;padding:10px 0}.empty{padding:50px 10px;text-align:center;color:var(--muted)}.giftGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.giftBtn{border:1px solid #30364d;background:#171b2c;border-radius:15px;padding:12px;color:#fff;text-align:left}.giftBtn b{font-size:26px}.giftBtn small{display:block;color:#a8aec3;margin-top:3px}
</style></head><body>
<div id="auth" class="auth"><div class="authCard"><img src="/assets/zelqora-logo.png" class="logo"><h1>Zelqora</h1><p class="muted">Chat • Watch • Connect</p><input id="name" class="field" placeholder="Name"><input id="email" class="field" placeholder="Email"><input id="password" class="field" type="password" placeholder="Password"><button class="btn" style="width:100%;margin-top:7px" onclick="register()">Create account</button><button class="btn alt" style="width:100%;margin-top:7px" onclick="login()">Log in</button><p id="authStatus" class="muted"></p></div></div>
<div id="app" class="app hide"><div class="top"><img src="/assets/zelqora-logo.png" class="miniLogo"><div><button class="btn alt" onclick="openSearch()">🔎 Search</button> <button class="btn alt" onclick="openZelqoraHub()">🚀 Tools</button></div></div>
<section id="home" class="page active"></section><section id="discover" class="page"></section><section id="create" class="page"></section><section id="inbox" class="page"></section><section id="profile" class="page"></section>
<nav class="bottom" aria-label="Zelqora navigation"><button data-p="home" onclick="go('home')"><b>⌂</b>Home</button><button data-p="discover" onclick="go('discover')"><b>✦</b>Discover</button><button data-p="create" onclick="go('create')" class="create zel-create" aria-label="Open Zelqora Create"><b><span class="zel-create-core">Z</span></b><span class="zel-create-label">Create</span></button><button data-p="inbox" onclick="go('inbox')"><b>◌</b>Messages</button><button data-p="profile" onclick="go('profile')"><b>◉</b>Me</button></nav></div><div id="modal"></div><div id="toast"></div>
<script>
let token=localStorage.getItem('zelqoraToken'),me=JSON.parse(localStorage.getItem('zelqoraUser')||'null'),feedMode='for-you',chatUser=null,feedCache=[];const $=id=>document.getElementById(id);
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{}),...(opt.body?{'Content-Type':'application/json'}:{})};let r=await fetch(path,opt);let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function toast(t){$('toast').textContent=t;$('toast').className='toast';setTimeout(()=>$('toast').className='',1800)}
async function register(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value})});save(d);if(d.welcomeBonus)toast('🎉 First 50 bonus: +10 free coins!')}catch(e){$('authStatus').textContent=e.message}}
async function login(){try{save(await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})}))}catch(e){$('authStatus').textContent=e.message}}
function save(d){token=d.token;me=d.user;localStorage.setItem('zelqoraToken',token);localStorage.setItem('zelqoraUser',JSON.stringify(me));start()}
async function start(){if(!token)return;$('auth').classList.add('hide');$('app').classList.remove('hide');await go('home')}
async function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));if(p==='home')loadHome();if(p==='discover')loadDiscover();if(p==='create')loadCreate();if(p==='inbox')loadInbox();if(p==='profile')loadProfile()}
async function loadHome(){let [vs,stories]=await Promise.all([api('/api/feed?mode='+feedMode),api('/api/stories')]);feedCache=vs;$('home').innerHTML=`<div class="feed" id="feed">${storyBar(stories)}${vs.length?vs.map(reel).join(''):'<div class="empty">No videos yet.<br>Create the first Zelqora video.</div>'}</div><div style="position:absolute;top:12px;left:75px;z-index:11"><button class="btn alt" onclick="setFeed('for-you')">For You</button><button class="btn alt" onclick="setFeed('following')">Following</button></div>`;observeVideos()}
function setFeed(m){feedMode=m;loadHome()}
function storyBar(stories){return `<div style="position:absolute;top:58px;left:0;right:0;z-index:8;padding:7px 12px;overflow:auto;display:flex;gap:8px;pointer-events:none">${stories.slice(0,12).map(s=>`<div class="storyAvatar" style="width:42px;height:42px"><div>${s.avatar?`<img src="${esc(s.avatar)}">`:'✨'}</div></div>`).join('')}</div>`}
function reel(v){return `<article class="reel" data-id="${v.id}"><video class="media" src="${esc(v.url)}" ${v.thumbnail?`poster="${esc(v.thumbnail)}"`:''} loop playsinline preload="metadata"></video><div class="shade"></div><div class="reelInfo"><h3>@${esc(v.creator)} ${v.userId===me.id?'✓':''}</h3><b>${esc(v.title)}</b><p>${esc(v.description)}</p><span class="tag">#Zelqora #ForYou</span></div><div class="rail"><button onclick="like('${v.id}')">${v.likedByMe?'♥':'♡'}<span>${v.likes||0}</span></button><button onclick="comments('${v.id}')">💬<span>${v.comments.length}</span></button><button onclick="saveVideo('${v.id}')">${v.savedByMe?'🔖':'🔖'}<span>${v.savedByMe?'Saved':'Save'}</span></button><button onclick="shareVideo('${v.id}')">↗<span>Share</span></button><button onclick="openGiftShop('${v.userId}')">🎁<span>Gift</span></button><button onclick="profileOf('${v.userId}')">◉<span>Profile</span></button></div></article>`}
function observeVideos(){let root=$('feed');if(!root)return;let obs=new IntersectionObserver(es=>es.forEach(e=>{let v=e.target.querySelector('video');if(e.isIntersecting){v.play().catch(()=>{});api('/api/videos/'+e.target.dataset.id+'/view',{method:'POST'}).catch(()=>{})}else v.pause()}),{root,threshold:.65});root.querySelectorAll('.reel').forEach(x=>obs.observe(x))}
async function like(id){await api('/api/videos/'+id+'/like',{method:'POST'});loadHome()};async function saveVideo(id){let d=await api('/api/videos/'+id+'/save',{method:'POST'});toast(d.saved?'Saved to your collection':'Removed from saved');loadHome()};function shareVideo(id){let u=location.origin+'/?video='+id;navigator.share?navigator.share({title:'Zelqora video',url:u}).catch(()=>{}):navigator.clipboard?.writeText(u).then(()=>toast('Link copied'))}
async function openGiftShop(creatorId){try{if(creatorId===me.id)return toast('You cannot send a gift to yourself');let d=await api('/api/gifts/catalog');$('modal').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="row"><h3>🎁 Zelqora Gifts</h3><button class="btn alt" onclick="closeModal()">Close</button></div><p class="muted">Choose an original Zelqora gift. Gift prices are in Coins and local currency is calculated automatically.</p><div class="giftGrid">'+d.gifts.map(g=>'<button class="giftBtn" onclick="sendGift(\''+creatorId+'\',\''+g.id+'\')"><b>'+g.emoji+'</b><br><strong>'+esc(g.name)+'</strong><small>'+g.coins.toLocaleString()+' coins • ₦'+Number(g.ngn).toLocaleString()+'</small></button>').join('')+'</div><p class="muted" style="font-size:11px;margin-top:12px">Maximum gift: 10,000,000 Coins.</p></div></div>';}catch(e){toast(e.message)}}async function sendGift(creatorId,giftId){try{let d=await api('/api/gifts',{method:'POST',body:JSON.stringify({creatorId,giftId})});closeModal();toast(d.giftEmoji+' '+d.giftName+' sent!')}catch(e){toast(e.message)}}async function comments(id){let v=feedCache.find(x=>x.id===id);$('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="row"><h3>Comments</h3><button class="btn alt" onclick="closeModal()">Close</button></div><div>${(v?.comments||[]).map(c=>`<p><b>${esc(c.name)}</b> ${esc(c.text)}</p>`).join('')||'<p class="muted">No comments yet.</p>'}</div><input id="commentText" class="field" placeholder="Add a comment"><button class="btn" onclick="postComment('${id}')">Post</button></div></div>`}
async function postComment(id){let t=$('commentText').value.trim();if(!t)return;await api('/api/videos/'+id+'/comments',{method:'POST',body:JSON.stringify({text:t})});closeModal();loadHome()};function closeModal(){$('modal').innerHTML=''}
async function loadDiscover(q=''){let d=await api('/api/discover?q='+encodeURIComponent(q));$('discover').innerHTML=`<div class="panel"><div class="search"><input id="discoverQ" class="field" placeholder="Search creators, videos, topics" value="${esc(q)}" onkeydown="if(event.key==='Enter')loadDiscover(this.value)"></div><div class="card"><h2>Discover</h2><p class="muted">Find creators and videos on Zelqora.</p></div><div class="card"><h3>Creators</h3>${d.users.map(u=>`<div class="user"><div class="avatar">${u.avatar?`<img src="${esc(u.avatar)}">`:esc(u.name[0])}</div><div style="flex:1"><b>${esc(u.name)}</b><div class="muted">${u.followers} followers</div></div><button class="btn alt" onclick="follow('${u.id}')">${u.following?'Following':'Follow'}</button></div>`).join('')||'<p class="muted">No creators found.</p>'}</div><h3>Videos</h3><div class="discoverGrid">${d.videos.map(v=>`<div class="thumb" onclick="playDiscover('${v.id}')"><video src="${esc(v.url)}" muted preload="metadata"></video></div>`).join('')}</div></div>`}
async function follow(id){let d=await api('/api/users/'+id+'/follow',{method:'POST'});toast(d.following?'Following':'Unfollowed');loadDiscover($('discoverQ')?.value||'')}
function playDiscover(id){let v=feedCache.find(x=>x.id===id);if(!v){go('home');return}go('home')}
function loadCreate(){$('create').innerHTML=`<div class="panel"><h2>Create</h2><div class="card"><span class="pill">VIDEO</span><h3>Post a video</h3><input id="vtitle" class="field" placeholder="Caption / title"><input id="vurl" class="field" placeholder="Public MP4/WebM URL"><input id="vthumb" class="field" placeholder="Thumbnail URL (optional)"><textarea id="vdesc" class="field" placeholder="Tell people what this video is about"></textarea><button class="btn" onclick="postVideo()">Publish</button></div><div class="card"><span class="pill">STORY</span><h3>Add a Story</h3><input id="surl" class="field" placeholder="Image/video URL"><input id="stext" class="field" placeholder="Story text"><button class="btn" onclick="postStory()">Share Story</button></div><div class="card"><h3>🎬 Creator Studio</h3><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px"><button class="btn" onclick="startLive()">🔴 Go LIVE</button><button class="btn alt" onclick="createDraft()">📝 Save Draft</button><button class="btn alt" onclick="makeAICaption()">✨ AI Caption</button><button class="btn alt" onclick="openSounds()">🎵 Sounds</button><button class="btn alt" onclick="openZelqoraWorlds()">🌎 Worlds</button><button class="btn alt" onclick="openZelqoraSignature()">✨ Originals</button></div></div><div class="card"><h3>Creator checklist</h3><p class="muted">Good lighting • clear audio • original content • respectful community behavior.</p></div></div>`}
async function postVideo(){let title=$('vtitle').value,url=$('vurl').value;if(!title||!url)return toast('Add a title and video URL');await api('/api/videos',{method:'POST',body:JSON.stringify({title,url,thumbnail:$('vthumb').value,description:$('vdesc').value})});toast('Video published');go('home')};async function postStory(){let url=$('surl').value,text=$('stext').value;if(!url&&!text)return toast('Add story content');await api('/api/stories',{method:'POST',body:JSON.stringify({url,text})});toast('Story shared');go('home')}
async function loadInbox(){let ns=await api('/api/notifications'),us=await api('/api/users');$('inbox').innerHTML=`<div class="panel"><h2>Inbox</h2><div class="card"><div class="row"><h3>Notifications</h3><button class="btn alt" onclick="readNotifs()">Read all</button></div>${ns.map(n=>`<div class="notice" style="padding:9px 0;border-bottom:1px solid #222638">${esc(n.text)}<div class="muted">${new Date(n.createdAt).toLocaleString()}</div></div>`).join('')||'<p class="muted">No notifications.</p>'}</div><div class="card"><h3>Messages</h3><input id="userSearch" class="field" placeholder="Search people" oninput="searchInbox()"><div id="people">${us.map(userRow).join('')||'<p class="muted">No other users yet.</p>'}</div></div><div id="chat"></div></div>`}
function userRow(u){return `<div class="user" onclick="openChat('${u.id}')"><div class="avatar">${u.avatar?`<img src="${esc(u.avatar)}">`:esc(u.name[0])}</div><div><b>${esc(u.name)}</b><div class="muted">${u.bio?esc(u.bio):'Zelqora creator'}</div></div></div>`};async function searchInbox(){let u=await api('/api/users?q='+encodeURIComponent($('userSearch').value));$('people').innerHTML=u.map(userRow).join('')||'<p class="muted">No matches.</p>'}
async function openChat(id){chatUser=id;let us=await api('/api/users'),u=us.find(x=>x.id===id)||{name:'User'},ms=await api('/api/chats/'+id);$('chat').innerHTML=`<div class="card"><div class="row"><h3>Chat with ${esc(u.name)}</h3><button class="btn alt" onclick="$('chat').innerHTML=''">Close</button></div><div class="chatMsgs" id="chatMsgs">${ms.map(m=>`<div class="msg ${m.from===me.id?'mine':''}">${esc(m.text)}<div class="muted" style="font-size:10px">${new Date(m.createdAt).toLocaleTimeString()}</div></div>`).join('')}</div><input id="msg" class="field" placeholder="Message" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn" onclick="sendMsg()">Send</button></div>`;$('chatMsgs').scrollTop=99999}
async function sendMsg(){let t=$('msg').value.trim();if(!t)return;await api('/api/chats/'+chatUser,{method:'POST',body:JSON.stringify({text:t})});openChat(chatUser)}async function readNotifs(){await api('/api/notifications/read',{method:'POST'});loadInbox()}
async function loadProfile(){let u=await api('/api/me'),vs=await api('/api/feed?mode=following');let mine=vs.filter(v=>v.userId===me.id);$('profile').innerHTML=`<div class="panel"><div class="profileHead"><div class="bigAvatar">${u.avatar?`<img src="${esc(u.avatar)}">`:'🙂'}</div><h2>${esc(u.name)} ${u.verified?'✓':''}</h2><p class="muted">${esc(u.bio||'No bio yet.')}</p></div><div class="stats"><div><b>${u.followers}</b><br><span class="muted">Followers</span></div><div><b>${u.following}</b><br><span class="muted">Following</span></div><div><b>${mine.length}</b><br><span class="muted">Posts</span></div></div><div class="row"><button class="btn alt" onclick="editProfile()">Edit profile</button><button class="btn alt" onclick="logout()">Log out</button></div><div class="card"><h3>Creator tools</h3><p class="muted">Buy coins, receive creator gifts, manage your bank account, and request real withdrawals when Paystack Transfers is enabled.</p><button class="btn" onclick="creatorTools()">Open creator wallet</button></div><h3>Your videos</h3><div class="discoverGrid">${mine.map(v=>`<div class="thumb"><video src="${esc(v.url)}" muted preload="metadata"></video></div>`).join('')||'<p class="muted">You have not posted yet.</p>'}</div></div>`}
function editProfile(){let u=me;$('modal').innerHTML=`<div class="modal"><div class="sheet"><h3>Edit profile</h3><input id="epname" class="field" value="${esc(u.name)}"><input id="epavatar" class="field" value="${esc(u.avatar||'')}" placeholder="Avatar image URL"><textarea id="epbio" class="field" placeholder="Bio">${esc(u.bio||'')}</textarea><button class="btn" onclick="saveProfile()">Save</button> <button class="btn alt" onclick="closeModal()">Cancel</button></div></div>`};async function saveProfile(){me=await api('/api/me',{method:'PATCH',body:JSON.stringify({name:$('epname').value,bio:$('epbio').value,avatar:$('epavatar').value})});localStorage.setItem('zelqoraUser',JSON.stringify(me));closeModal();loadProfile()}
async function creatorTools(){try{let [w,tx,ps,pa,payouts]=await Promise.all([api('/api/wallet'),api('/api/wallet/transactions'),api('/api/payments/status'),api('/api/payout/account'),api('/api/payouts')]);$('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="row"><h3>💰 Zelqora Creator Wallet</h3><button class="btn alt" onclick="closeModal()">Close</button></div><div class="card"><div style="font-size:28px;font-weight:800">$${w.usd.toFixed(2)}</div><div class="muted">${w.coins} total coins • ${w.creatorEarningsCoins||0} creator coins available to withdraw</div><div class="muted">Creator earnings are valued at 1 coin = ₦30 in Nigeria. Your main wallet display remains USD.</div></div><div class="card"><h3>🪙 Buy Zelqora Coins</h3><p class="muted">Pay securely with Paystack.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${[[5,150],[10,300],[50,1500],[100,3000],[500,15000],[1000,30000]].map(([n,p])=>`<button class="btn" onclick="buyCoins(${n})">${n} coins<br>₦${p.toLocaleString()}</button>`).join('')}</div><p class="muted" style="font-size:11px;margin-top:10px">${ps.enabled?'Paystack live payments are configured on the server.':'Paystack is not configured on the server yet.'}</p></div><div class="card"><h3>🏦 Withdrawal account</h3>${pa?`<p><b>${esc(pa.bankName||'Bank')}</b><br>${esc(pa.accountName||'')}<br>•••• ${esc(pa.accountNumberLast4||'')}</p><button class="btn alt" onclick="removePayoutAccount()">Remove bank account</button>`:`<p class="muted">Add a Nigerian bank account. We verify the account name before saving it.</p><button class="btn" onclick="openPayoutAccountForm()">Add bank account</button>`}</div><div class="card"><h3>💸 Withdraw creator earnings</h3><p class="muted">Minimum 100 creator coins = ₦3,000. Maximum single withdrawal = ₦30,000,000. Paystack transfer fees are charged to the Zelqora Paystack balance.</p>${pa?`<input id="withdrawCoins" class="field" type="number" min="100" step="1" placeholder="Creator coins to withdraw"><button class="btn" onclick="requestCreatorWithdrawal()">Withdraw to •••• ${esc(pa.accountNumberLast4||'')}</button>`:'<p class="muted">Add your bank account first.</p>'}</div><div class="card"><h3>📜 Withdrawal history</h3>${payouts.length?payouts.map(p=>`<div class="notice" style="margin:5px 0"><b>${esc(p.status)}</b> • ${p.coins} coins • ₦${Number(p.amountNgn||0).toLocaleString()}<br><span class="muted">${new Date(p.createdAt).toLocaleString()}</span></div>`).join(''):'<span class="muted">No withdrawals yet.</span>'}</div><div class="card"><h3>Exchange quote</h3><select id="walletCurrency" class="field"><option>USD</option><option>NGN</option><option>GBP</option><option>EUR</option><option>GHS</option><option>KES</option><option>ZAR</option><option>CAD</option><option>AUD</option><option>INR</option></select><p id="walletQuote" class="muted">Loading exchange rate…</p></div><div class="card"><h3>🎉 First 50 launch reward</h3><p class="muted">The first 50 registered users receive 10 free coins. Launch rewards and purchased coins are not creator earnings.</p></div><p class="muted">Recent transactions</p>${tx.map(t=>`<div>${esc(t.type)}: ${t.coins}</div>`).join('')||'<span class="muted">No transactions yet.</span>'}</div></div>`;walletQuote();$('walletCurrency').onchange=walletQuote}catch(e){toast(e.message)}}async function openPayoutAccountForm(){try{let d=await api('/api/payout/banks');$('modal').innerHTML=`<div class="modal"><div class="sheet"><h3>🏦 Add bank account</h3><select id="payoutBank" class="field"><option value="">Select your bank</option>${d.banks.map(b=>`<option value="${esc(b.code)}" data-name="${esc(b.name)}">${esc(b.name)}</option>`).join('')}</select><input id="payoutAccountNumber" class="field" inputmode="numeric" maxlength="10" placeholder="10-digit account number"><button class="btn" onclick="resolvePayoutAccount()">Verify account</button><p id="payoutResolve" class="notice"></p><button class="btn alt" onclick="closeModal()">Cancel</button></div></div>`}catch(e){toast(e.message)}}
async function resolvePayoutAccount(){try{let bank=$('payoutBank'),account=$('payoutAccountNumber').value.trim();if(!bank.value||!/^[0-9]{10}$/.test(account))return toast('Select a bank and enter a 10-digit account number');let d=await api('/api/payout/resolve',{method:'POST',body:JSON.stringify({bankCode:bank.value,accountNumber:account})});$('payoutResolve').innerHTML=`Account name: <b>${esc(d.accountName)}</b><br><button class="btn" onclick="savePayoutAccount()">Save this account</button>`;window._payoutResolved=d}catch(e){$('payoutResolve').textContent=e.message}}
async function savePayoutAccount(){try{let bank=$('payoutBank');let d=window._payoutResolved;if(!d)return;await api('/api/payout/account',{method:'POST',body:JSON.stringify({bankCode:d.bankCode,accountNumber:d.accountNumber,bankName:bank.options[bank.selectedIndex].dataset.name})});window._payoutResolved=null;toast('Bank account saved');creatorTools()}catch(e){$('payoutResolve').textContent=e.message}}
async function removePayoutAccount(){if(!confirm('Remove your saved withdrawal bank account?'))return;try{await api('/api/payout/account',{method:'DELETE'});toast('Bank account removed');creatorTools()}catch(e){toast(e.message)}}
async function requestCreatorWithdrawal(){try{let coins=Number($('withdrawCoins').value);if(!Number.isInteger(coins)||coins<100)return toast('Enter at least 100 creator coins');let d=await api('/api/payout/request',{method:'POST',body:JSON.stringify({coins})});toast(d.message||'Withdrawal submitted');creatorTools()}catch(e){toast(e.message)}}
async function buyCoins(coins){try{let d=await api('/api/payments/paystack/initialize',{method:'POST',body:JSON.stringify({coins})});if(d.authorizationUrl){location.href=d.authorizationUrl}else throw Error('Paystack did not return a checkout link')}catch(e){toast(e.message)}}function openSearch(){go('discover');setTimeout(()=>$('discoverQ')?.focus(),100)}function profileOf(id){if(id===me.id)go('profile');else toast('Open creator from Discover')}
function logout(){localStorage.clear();location.reload()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let ws=null;
function connectRealtime(){if(!token)return;try{const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='message'){toast('New message');if($('inbox')?.classList.contains('active'))loadInbox()}}catch{}};ws.onclose=()=>setTimeout(connectRealtime,2500)}catch{}}
if(token){start();connectRealtime()}
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script><script src="/features.js"></script><script src="/ultimate.js"></script><script src="/signature.js"></script><button class="floating-feature" onclick="openZelqoraSignature()">✨ Zelqora Originals</button></body></html>
