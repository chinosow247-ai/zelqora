<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zelqora</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18255d,#070a18 45%);color:#fff;font:15px system-ui;min-height:100vh}main{max-width:900px;margin:auto;padding:18px 14px 70px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:15px}.brand img{width:52px;border-radius:15px}.muted{color:#a2acd0}.card{background:#10172eec;border:1px solid #293355;border-radius:20px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px;border-radius:15px;background:#151e3a}.stat b{font-size:23px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#21305c;color:#9fe5ff;font-size:11px}.btn{border:0;color:white;background:linear-gradient(90deg,#18bfff,#7b3cff,#ee27c8);padding:11px 14px;border-radius:12px;font-weight:800;cursor:pointer;margin:3px}.btn.alt{background:#1a2341;border:1px solid #303b60}.field{padding:11px;width:100%;background:#090e20;color:#fff;border:1px solid #30395e;border-radius:11px;margin:4px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.hide{display:none}.notice{padding:9px 11px;border-radius:11px;background:#171f3b;color:#aeb9da;font-size:12px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;position:sticky;bottom:8px;background:#0c1225ee;padding:6px;border:1px solid #293355;border-radius:16px;z-index:3}.nav button{border:0;background:transparent;color:#aeb9da;padding:8px 3px;border-radius:10px}.nav button.active{background:#1d2a50;color:#fff}.page{display:none}.page.active{display:block}.user{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #222c49;cursor:pointer}.avatar{width:40px;height:40px;border-radius:50%;background:#24345e;display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.msg{max-width:80%;padding:9px 12px;border-radius:15px;background:#192340;margin:5px 0}.mine{margin-left:auto;background:#263a72}.video{background:#0b1020;border:1px solid #293355;border-radius:16px;overflow:hidden;margin-bottom:12px}.video video{width:100%;max-height:430px;background:#000}.video .body{padding:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.comment{padding:5px 0;font-size:13px}.small{font-size:12px}.hide{display:none}@media(max-width:600px){main{padding:12px 10px 72px}.grid{grid-template-columns:1fr 1fr}.nav button{font-size:11px}}
</style></head><body><main>
<div class="brand"><img src="/assets/zelqora-logo.png"><div><h1 style="margin:0">Zelqora</h1><div class="muted">Chat • Watch • Connect</div></div></div>
<section id="auth" class="card"><h2>Welcome to Zelqora</h2><input id="name" class="field" placeholder="Name"><input id="email" class="field" placeholder="Email"><input id="password" type="password" class="field" placeholder="Password"><button class="btn" onclick="register()">Create account</button><button class="btn alt" onclick="login()">Login</button><p id="status" class="muted"></p></section>
<section id="app" class="hide"><div id="home" class="page active"></div><div id="chats" class="page"></div><div id="videos" class="page"></div><div id="profile" class="page"></div><div id="more" class="page"></div><div class="nav"><button onclick="show('home')">🏠<br>Home</button><button onclick="show('chats')">💬<br>Chats</button><button onclick="show('videos')">▶️<br>Videos</button><button onclick="show('profile')">👤<br>Profile</button><button onclick="show('more')">☰<br>More</button></div></section>
</main><script>
let token=localStorage.getItem('zelqoraToken'),me=JSON.parse(localStorage.getItem('zelqoraUser')||'null'),chatUser=null;$=id=>document.getElementById(id);
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{}),...(opt.body?{'Content-Type':'application/json'}:{})};let r=await fetch(path,opt),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function register(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value})});save(d)}catch(e){$('status').textContent=e.message}}
async function login(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});save(d)}catch(e){$('status').textContent=e.message}}
function save(d){token=d.token;me=d.user;localStorage.setItem('zelqoraToken',token);localStorage.setItem('zelqoraUser',JSON.stringify(me));start()}
function logout(){localStorage.clear();location.reload()}
async function start(){if(!token)return;$('auth').classList.add('hide');$('app').classList.remove('hide');await loadHome();}
function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['home','chats','videos','profile','more'][i]===p));if(p==='home')loadHome();if(p==='chats')loadChats();if(p==='videos')loadVideos();if(p==='profile')loadProfile();if(p==='more')loadMore()}
async function loadHome(){let n=await api('/api/notifications');$('home').innerHTML=`<div class="card"><span class="pill">HOME</span><h2>Welcome, ${esc(me.name)} 👋</h2><p class="muted">Connect with people, chat privately and discover videos.</p><button class="btn" onclick="show('videos')">Watch videos</button> <button class="btn alt" onclick="show('chats')">Start chatting</button></div><div class="card"><div class="row"><h3>🔔 Notifications</h3><button class="btn alt" onclick="readNotifications()">Mark read</button></div>${n.length?n.slice(0,8).map(x=>`<div class="notice" style="margin:5px 0">${esc(x.text)} <span class="small">${new Date(x.createdAt).toLocaleString()}</span></div>`).join(''):'<span class="muted">No notifications yet.</span>'}</div>`}
async function readNotifications(){await api('/api/notifications/read',{method:'POST'});loadHome()}
async function loadChats(){let us=await api('/api/users');$('chats').innerHTML=`<div class="card"><h2>💬 Chats</h2><input id="searchUsers" class="field" placeholder="Search people" oninput="searchUsers()"><div id="userList">${us.map(userRow).join('')||'<span class="muted">No other users yet. Create another account to test chat.</span>'}</div></div><div id="chatBox"></div>`}
function userRow(u){return `<div class="user" onclick="openChat('${u.id}')"><div class="avatar">${u.avatar?`<img src="${esc(u.avatar)}">`:esc(u.name[0]||'?')}</div><div><b>${esc(u.name)}</b><div class="muted small">${esc(u.bio||'Zelqora user')}</div></div></div>`}
async function searchUsers(){let q=$('searchUsers').value,us=await api('/api/users?q='+encodeURIComponent(q));$('userList').innerHTML=us.map(userRow).join('')||'<span class="muted">No matches.</span>'}
async function openChat(id){chatUser=id;let us=await api('/api/users'),u=us.find(x=>x.id===id)||{name:'User'};let ms=await api('/api/chats/'+id);$('chatBox').innerHTML=`<div class="card"><div class="row"><h3>Chat with ${esc(u.name)}</h3><button class="btn alt" onclick="loadChats()">Back</button></div><div id="messages">${ms.map(m=>`<div class="msg ${m.from===me.id?'mine':''}">${esc(m.text)}<div class="small muted">${new Date(m.createdAt).toLocaleTimeString()}</div></div>`).join('')}</div><input id="messageText" class="field" placeholder="Write a message..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn" onclick="sendMessage()">Send</button></div>`;window.scrollTo(0,document.body.scrollHeight)}
async function sendMessage(){let x=$('messageText').value.trim();if(!x)return;await api('/api/chats/'+chatUser,{method:'POST',body:JSON.stringify({text:x})});openChat(chatUser)}
async function loadVideos(){let vs=await api('/api/videos');$('videos').innerHTML=`<div class="card"><h2>▶️ Video Feed</h2><p class="muted">Upload a video by providing a public video URL. Local file upload/storage can be added next.</p><input id="vtitle" class="field" placeholder="Video title"><input id="vurl" class="field" placeholder="Video URL (mp4/webm)"><input id="vdesc" class="field" placeholder="Description"><button class="btn" onclick="postVideo()">Publish video</button></div>${vs.length?vs.map(videoCard).join(''):'<div class="card muted">No videos yet.</div>'}`}
function videoCard(v){return `<div class="video"><video controls preload="metadata" src="${esc(v.url)}"></video><div class="body"><b>${esc(v.title)}</b><div class="muted">by ${esc(v.creator)} • ${new Date(v.createdAt).toLocaleString()}</div><p>${esc(v.description)}</p><div class="actions"><button class="btn alt" onclick="likeVideo('${v.id}')">❤️ ${v.likes}</button></div><div>${v.comments.slice(-5).map(c=>`<div class="comment"><b>${esc(c.name)}:</b> ${esc(c.text)}</div>`).join('')}</div><input id="c-${v.id}" class="field" placeholder="Comment"><button class="btn alt" onclick="commentVideo('${v.id}')">Comment</button></div></div>`}
async function postVideo(){let title=$('vtitle').value,url=$('vurl').value,description=$('vdesc').value;if(!title||!url)return alert('Add a title and video URL');await api('/api/videos',{method:'POST',body:JSON.stringify({title,url,description})});loadVideos()}
async function likeVideo(id){await api('/api/videos/'+id+'/like',{method:'POST'});loadVideos()}
async function commentVideo(id){let text=$('c-'+id).value.trim();if(!text)return;await api('/api/videos/'+id+'/comments',{method:'POST',body:JSON.stringify({text})});loadVideos()}
async function loadProfile(){let u=await api('/api/me');$('profile').innerHTML=`<div class="card"><span class="pill">PROFILE</span><h2>${esc(u.name)}</h2><p class="muted">${esc(u.email)}</p><input id="pname" class="field" value="${esc(u.name)}"><textarea id="pbio" class="field" placeholder="Bio">${esc(u.bio||'')}</textarea><input id="pavatar" class="field" value="${esc(u.avatar||'')}" placeholder="Profile image URL"><button class="btn" onclick="saveProfile()">Save profile</button></div>`}
async function saveProfile(){let u=await api('/api/me',{method:'PATCH',body:JSON.stringify({name:$('pname').value,bio:$('pbio').value,avatar:$('pavatar').value})});me={...me,...u};localStorage.setItem('zelqoraUser',JSON.stringify(me));loadProfile()}
async function loadMore(){let w=await api('/api/wallet'),tx=await api('/api/wallet/transactions');$('more').innerHTML=`<div class="card"><span class="pill">WALLET</span><h2>💎 Zelqora Wallet</h2><div class="grid"><div class="stat"><div class="muted">Coins</div><b>${w.coins}</b></div><div class="stat"><div class="muted">Premium</div><b>${w.premium?'Yes ⭐':'No'}</b></div></div></div><div class="card"><h3>Get test coins</h3><button class="btn" onclick="topup(100)">+100</button><button class="btn" onclick="topup(500)">+500</button><button class="btn" onclick="topup(1000)">+1,000</button><button class="btn alt" onclick="premium()">Premium (Test)</button></div><div class="card"><h3>🎁 Creator gift</h3><input id="creator" class="field" placeholder="Creator ID (e.g. u2)"><input id="giftCoins" class="field" type="number" placeholder="Coins"><button class="btn" onclick="gift()">Send Gift</button><p id="giftStatus" class="notice"></p></div><div class="card"><h3>💰 Creator payout</h3><input id="payoutCoins" class="field" type="number" placeholder="Coins"><button class="btn" onclick="payout()">Request payout</button><p id="payoutStatus" class="notice"></p></div><div class="card"><h3>📜 Transactions</h3>${tx.length?tx.map(x=>`<div class="notice" style="margin:5px 0"><b>${esc(x.type)}</b> ${x.coins>0?'+':''}${x.coins} • ${new Date(x.createdAt).toLocaleString()}</div>`).join(''):'<span class="muted">No transactions yet.</span>'}</div><button class="btn alt" onclick="logout()">Log out</button><div class="notice">Payments are still test-mode. Real payment-provider integration will be connected later.</div>`}
async function topup(n){await api('/api/wallet/test-topup',{method:'POST',body:JSON.stringify({coins:n})});loadMore()}async function premium(){await api('/api/premium/test',{method:'POST'});loadMore()}async function gift(){try{let d=await api('/api/gifts',{method:'POST',body:JSON.stringify({creatorId:$('creator').value,coins:Number($('giftCoins').value)})});$('giftStatus').textContent=`Sent ${d.coins} coins; creator share ${d.creatorShare}.`;loadMore()}catch(e){$('giftStatus').textContent=e.message}}async function payout(){try{let d=await api('/api/payout/request',{method:'POST',body:JSON.stringify({coins:Number($('payoutCoins').value)})});$('payoutStatus').textContent='Payout '+d.p.status+' (test mode).';loadMore()}catch(e){$('payoutStatus').textContent=e.message}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(token)start();
</script></body></html>
